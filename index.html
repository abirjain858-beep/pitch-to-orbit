<title>Pitch to Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a blueprint drawing sheet. The craft drawing is pinned on the left, the numbered work sheet sits on the right, and on phones they stack. */
:root{
  --sheet:#0b2149;
  --panel:#102a5c;
  --line:#4d7fd6;
  --line-soft:rgba(125,170,240,.30);
  --ink:#eaf2ff;
  --dim:#9db7e6;
  --signal:#ff6b2c;
  --signal-ink:#1d0b03;
  --coin:#ffd24a;
  --ok:#5fe3a1;
  --bad:#ff6b72;
  --field:#071a40;
  --grid:rgba(130,175,255,.07);
  --grid-major:rgba(130,175,255,.14);
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--sheet)}
body{
  margin:0;
  background-color:var(--sheet);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;
  color:var(--ink);
  font:15px/1.5 var(--font-body);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1180px;margin:0 auto}
h1,h2{font-family:var(--font-display);text-transform:uppercase;margin:0;text-wrap:balance}
h1{font-weight:800;font-size:clamp(36px,7vw,60px);line-height:.9;letter-spacing:.02em}
h2{font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1;letter-spacing:.02em}
p{margin:0}
.meta{font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.note{color:var(--dim);font-size:13px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.top .meta{margin-bottom:8px}
.wallet{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:8px 14px;background:rgba(7,26,64,.7)}
.wallet .coin{width:20px;height:20px;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 4px rgba(120,80,0,.28)}
.wallet b{font:600 26px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.wallet.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,74,.7)}100%{box-shadow:0 0 0 16px rgba(255,210,74,0)}}

.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.steps button{display:grid;gap:2px;text-align:left;border:0;background:var(--sheet);color:var(--dim);padding:10px 12px;cursor:pointer;font:inherit;min-height:56px}
.steps button .meta{color:inherit}
.steps button b{font:800 20px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.steps button[aria-current="step"]{background:var(--ink);color:var(--sheet)}
.steps button:disabled{opacity:.38;cursor:not-allowed}
.steps button:focus-visible,.btn:focus-visible,textarea:focus-visible,input[type=text]:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

.layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:12px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .side .bd{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center}
}

.panel{border:1px solid var(--line);background:rgba(16,42,92,.88)}
.panel>.hd{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.panel>.bd{padding:16px}
.stack{display:grid;gap:20px}
.stack>*{min-width:0}

.craft{position:relative;display:grid;place-items:center;padding:4px}
.craft::before{content:"";position:absolute;left:50%;top:3%;bottom:3%;border-left:1px dashed var(--line-soft)}
.craft svg{position:relative;width:100%;max-width:330px;height:auto;display:block}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:12px 0 0;font:12px/1.4 var(--font-mono)}
.side .bd .spec{margin:0}
.spec dt{color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.spec dd{margin:0;text-align:right;overflow-wrap:anywhere}

label,legend{font:500 12px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:10px}
legend{padding:0;margin-bottom:10px;float:left;width:100%}
legend+*{clear:both}
.field{display:grid;gap:8px}
input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font:15px/1.5 var(--font-body);border-radius:0}
textarea{resize:vertical;min-height:112px}
.count{text-align:right;font:12px var(--font-mono);color:var(--dim)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.opt{position:relative;display:grid;gap:4px;align-content:start;border:1px solid var(--line-soft);background:rgba(7,26,64,.55);padding:12px;cursor:pointer;text-transform:none;letter-spacing:0;font:inherit;color:var(--ink)}
.opt b{font:800 20px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--signal);background:rgba(255,107,44,.13);box-shadow:inset 0 0 0 1px var(--signal)}
.opt:has(input:focus-visible){outline:2px solid var(--coin);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt:has(input:disabled:checked){opacity:1}
.opt .mini{display:block;height:120px;margin-bottom:4px}
.opt .mini svg{height:100%;width:100%}
.opt .meta,.opt .note{text-transform:none;letter-spacing:.02em}
.opt .meta{text-transform:uppercase;letter-spacing:.08em}

.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;width:40px;height:40px;background:var(--c);border:2px solid rgba(255,255,255,.35);cursor:pointer;display:block}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.sw:has(input:checked),.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.sw:has(input:focus-visible){outline:3px solid var(--coin);outline-offset:2px}
.sw.custom{background:conic-gradient(from 0deg,#ff5f5f,#ffd24a,#5fe3a1,#37d0ff,#9a7bdc,#ff5f5f)}
.sw.custom.on{background:var(--c)}
.sw.custom span{position:absolute;inset:0;display:grid;place-items:center;font:600 18px var(--font-mono);color:#071430;mix-blend-mode:normal;text-shadow:0 0 3px #fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.sponsor{display:grid;gap:8px;align-content:start;border:1px solid var(--line-soft);background:rgba(7,26,64,.55);padding:12px}
.sponsor .sname{font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.sponsor .quote{font-size:14px}
.sponsor .grant{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line-soft);padding-top:8px;font-family:var(--font-mono)}
.sponsor .grant b{color:var(--coin);font-size:17px}
.sponsor.t-none .grant b{color:var(--bad)}
.sponsor[class*="t-"]{animation:rise .5s ease-out both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.summary{border:1px solid var(--coin);padding:12px 14px;background:rgba(255,210,74,.08)}

.perk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line-soft)}
.perk:first-child{border-top:0}
.perk .nm{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 11px var(--font-mono);letter-spacing:.06em;padding:2px 8px;border:1px solid var(--line-soft);color:var(--dim)}
.chip.coin{color:var(--coin);border-color:rgba(255,210,74,.5)}
.ctl{display:flex;align-items:center;gap:8px}
.qbtn{min-width:44px;min-height:44px;padding:0 12px}
.qty{min-width:22px;text-align:center;font:600 16px var(--font-mono)}
.tablewrap{overflow-x:auto}
table.fit{width:100%;border-collapse:collapse;font:13px var(--font-mono)}
table.fit th,table.fit td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
table.fit th{color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.okc{color:var(--ok)}.badc{color:var(--bad)}

.rocketcard .stats{display:flex;flex-wrap:wrap;gap:4px 12px}
#rockets .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.pc{display:grid;gap:12px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line-soft);letter-spacing:0}
.pc .blk{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.pc .blk svg{width:26px;height:26px}
.pc .lab{display:block;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.pc .up .lab{color:var(--ok)}
.pc .down .lab{color:var(--bad)}
.pc .it{display:block;font-size:13px;line-height:1.4;color:var(--ink)}
.who{display:flex;gap:12px;align-items:center}
.who>div:last-child{min-width:0}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--line);overflow:hidden;background:#1a3a7a}
.avatar svg{display:block;width:100%;height:100%}
.scene{margin:0;border:1px solid var(--line-soft);background:#050a18}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption{padding:6px 10px;border-top:1px solid var(--line-soft);font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.price{font:600 18px var(--font-mono);color:var(--coin)}
.stage{position:relative;height:380px;overflow:hidden;border:1px solid var(--line);background:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 40%,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 62% 12%,#fff,transparent),radial-gradient(1px 1px at 80% 34%,#cfe0ff,transparent),radial-gradient(1px 1px at 90% 70%,#fff,transparent),radial-gradient(1px 1px at 8% 62%,#cfe0ff,transparent),
  linear-gradient(#061638,#143272)}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:#0a1b40;border-top:2px solid var(--line)}
.stage #rk{position:relative;height:100%;transition:transform 2.6s cubic-bezier(.55,0,.9,.5)}
.stage #rk svg{height:100%;width:auto;display:block;margin:0 auto}
.stage.go #rk{transform:translateY(-118%)}
.stage .count{position:absolute;left:12px;top:10px;font:600 26px var(--font-mono);letter-spacing:.1em}
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.stage.go .flame{opacity:1;animation:flick .12s infinite alternate}
@keyframes flick{from{transform:scaleY(.82)}to{transform:scaleY(1.18)}}

.bar{height:12px;border:1px solid var(--line-soft);background:var(--field)}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--coin)}
.bar.bad i{background:var(--bad)}
.odds{font:600 36px/1 var(--font-mono)}
.result{border:2px solid var(--line);padding:16px;display:grid;gap:12px}
.result.ok{border-color:var(--ok)}
.result.bad{border-color:var(--bad)}
.verdict{font:800 clamp(44px,9vw,72px)/.9 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.result.ok .verdict{color:var(--ok)}
.result.bad .verdict{color:var(--bad)}
.msg{font-size:17px}

.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.meter{display:grid;gap:6px}
.evt{margin:0;font:800 26px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.oplog{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.linkbox{margin-top:14px}
.impact{border-top:1px solid var(--line-soft);padding-top:12px}
.impactview{position:relative}
.hot{position:absolute;width:44px;height:44px;padding:9px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--t);background:#071430;color:#fff;cursor:pointer;display:grid;place-items:center}
.hot svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hot:hover{filter:brightness(1.3)}
.hot:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.hot[aria-pressed="true"]{background:var(--t);color:#071430;animation:hotpulse 1.6s infinite}
@keyframes hotpulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.2)}}
.beam{stroke-dasharray:7 7;animation:beamflow .7s linear infinite}
@keyframes beamflow{to{stroke-dashoffset:-14}}

/* ---------- Space skin: looks and motion only ---------- */
html{background:radial-gradient(120% 90% at 80% -10%,#3b2a86 0%,#14245f 38%,#060d2a 75%,#030616 100%) fixed}
body{background-color:transparent;background-size:48px 48px,48px 48px,240px 240px,240px 240px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
.brand{display:flex;align-items:center;gap:clamp(12px,3vw,26px);min-width:0}
.patch{flex:none;width:clamp(112px,17vw,172px);padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 8px 22px rgba(255,160,50,.35));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.patch:hover{transform:scale(1.07) rotate(-4deg)}
.patch:active{transform:scale(.95)}
.patch:focus-visible{outline:2px solid var(--coin);outline-offset:4px;border-radius:12px}
.patch svg{display:block;width:100%;height:auto;overflow:visible}
.patch.spin svg{animation:patchspin .9s cubic-bezier(.3,1.2,.5,1)}
@keyframes patchspin{to{transform:rotate(360deg)}}
.patch .orb{transform-origin:100px 96px;animation:orbit 7s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.patch .ship{animation:shipbob 2.6s ease-in-out infinite}
@keyframes shipbob{50%{transform:translateY(-5px)}}
.patch .twk{animation:twk 1.8s ease-in-out infinite}
.patch .twk.b{animation-delay:.7s}
@keyframes twk{50%{opacity:.25}}
h1{background:linear-gradient(95deg,#fff 20%,#ffd24a 62%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(255,180,70,.28))}
.top{border-bottom:0;align-items:center}
.wallet{border-radius:999px;border-color:rgba(255,210,74,.6);background:rgba(7,18,50,.75);box-shadow:0 0 20px rgba(255,210,74,.18);position:relative}
.wallet .coin{animation:coinspin 3.2s ease-in-out infinite}
@keyframes coinspin{0%,70%,100%{transform:scaleX(1)}85%{transform:scaleX(.12)}}
.delta{position:absolute;right:16px;top:-6px;font:700 18px var(--font-mono);animation:deltaup 1.1s ease-out forwards;pointer-events:none}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
@keyframes deltaup{to{transform:translateY(-30px);opacity:0}}
.steps{border-radius:14px;overflow:hidden;background:rgba(125,170,240,.28);margin-bottom:8px}
.steps button{background:rgba(9,24,66,.9);transition:background .2s,color .2s}
.steps button:not(:disabled):not([aria-current="step"]):hover{background:#1c3c86;color:var(--ink)}
.steps button[aria-current="step"]{background:linear-gradient(120deg,#ffd24a,#ff8a3d);color:#1d0b03}
.steps button.done b::after{content:" ✓";color:var(--ok)}
.steps button[aria-current="step"].done b::after{color:#1d0b03}
.track{position:relative;height:30px;margin-bottom:12px}
.track::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:2px dotted rgba(157,183,230,.45)}
.track i{position:absolute;left:0;top:13px;height:4px;border-radius:4px;background:linear-gradient(90deg,#ff6b2c,#ffd24a);transition:width .7s cubic-bezier(.3,1,.4,1)}
.track span{position:absolute;top:0;width:30px;height:30px;margin-left:-15px;transition:left .7s cubic-bezier(.3,1,.4,1)}
.track svg{width:100%;height:100%;display:block}
.panel{border-radius:16px;border-color:rgba(125,170,240,.45);background:rgba(13,32,82,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 14px 40px rgba(2,6,24,.45);overflow:hidden}
#sheet>.panel{animation:sheetin .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.side{overflow:hidden}
.craft{perspective:700px}
.craft::before{display:none}
#craft::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:12px;border-radius:50%;background:rgba(55,208,255,.22);filter:blur(7px)}
.craft svg{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -8px}}
.craft.pop{animation:craftpop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes craftpop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.opt{border-radius:13px;transition:transform .18s cubic-bezier(.3,1.5,.5,1),border-color .18s,box-shadow .18s,background .18s}
.opt:not(:has(input:disabled)):hover{transform:translateY(-4px);border-color:var(--coin);box-shadow:0 10px 24px rgba(255,190,70,.16)}
.opt:not(:has(input:disabled)):active{transform:scale(.98)}
.opt:has(input:checked){box-shadow:0 0 0 1px var(--signal),0 0 24px rgba(255,107,44,.34);animation:optpick .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes optpick{0%{transform:scale(.96)}100%{transform:scale(1)}}
.opt:has(input:checked)::after{content:"✓";position:absolute;right:9px;top:9px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--signal);color:#1d0b03;font:700 15px var(--font-body);pointer-events:none}
.opt .mini{transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.opt:not(:has(input:disabled)):hover .mini{transform:scale(1.12) translateY(-3px)}
.sw{border-radius:9px;transition:transform .16s cubic-bezier(.3,1.7,.5,1)}
.sw:hover{transform:scale(1.14) rotate(-3deg)}
.btn{border-radius:11px;transition:transform .15s cubic-bezier(.3,1.7,.5,1),box-shadow .15s,filter .15s}
.btn.primary{background:linear-gradient(120deg,#ffb03a,#ff6b2c);box-shadow:0 6px 18px rgba(255,107,44,.34)}
.btn:not(:disabled):hover{transform:translateY(-2px)}
.btn:not(:disabled):active{transform:scale(.96)}
#launchbtn:not(:disabled){animation:ready 1.5s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 9px rgba(255,107,44,.16),0 6px 18px rgba(255,107,44,.34)}}
input[type=text],textarea{border-radius:10px;transition:box-shadow .15s}
input[type=text]:focus,textarea:focus{box-shadow:0 0 0 3px rgba(255,210,74,.25)}
.sponsor{border-radius:13px;transition:transform .18s}
.sponsor:hover{transform:translateY(-3px)}
.avatar{transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.sponsor:hover .avatar{transform:scale(1.1) rotate(-4deg)}
.perk{padding-inline:8px;border-radius:9px;transition:background .15s}
.perk:hover{background:rgba(125,170,240,.1)}
.chip{border-radius:999px}
.summary,.result,.scene,.stage,.bar,.bar i{border-radius:10px}
.scene,.stage{overflow:hidden}
.bar{overflow:hidden}
.bar i{transition:width .4s;background-image:linear-gradient(90deg,var(--ok),#b9ffdc)}
.bar.warn i{background-image:linear-gradient(90deg,var(--coin),#ffe9a3)}
.bar.bad i{background-image:linear-gradient(90deg,var(--bad),#ffb0b4)}

function mapBgSVG(P, W, H){

function isNarrow(){ return !!(window.matchMedia && window.matchMedia('(max-width:700px)').matches); }

function selectLevel(i){

function startLevel(i){

function wipeProgress(btn){

var wasNarrow = isNarrow();
addEventListener('resize', function(){ var n = isNarrow(); if (n !== wasNarrow) { wasNarrow = n; if (state.step === 0) renderStep(); } });

/* ---------- Effects: looks only, no game rules here ---------- */
var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var shownCoins = null, coinTimer = 0;
function fxCoins(v){
  var el = $('#coins'), from = shownCoins;
  shownCoins = v;
  clearInterval(coinTimer);
  if (from === null || from === v || calm) { el.textContent = nf(v); return; }
  var w = $('#wallet'), d = document.createElement('span');
  d.className = 'delta ' + (v > from ? 'up' : 'down'); d.textContent = (v > from ? '+' : '−') + nf(Math.abs(v - from));
  w.appendChild(d); setTimeout(function(){ d.remove(); }, 1100);
  var n = 0, steps = 16;
  coinTimer = setInterval(function(){
    n++; el.textContent = nf(from + (v - from) * n / steps);
    if (n >= steps) { clearInterval(coinTimer); el.textContent = nf(v); }
  }, 28);
}
function fxSparks(x, y){
  if (calm) return;
  var fx = $('#fx'), cols = ['#ffd24a','#ff8a3d','#37d0ff','#fff'];
  for (var i = 0; i < 10; i++) {
    var e = document.createElement('i'), a = i / 10 * 6.283, r = 26 + Math.random() * 30;
    e.className = 'spark'; e.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + cols[i % 4] + ';--x:' + Math.cos(a) * r + 'px;--y:' + Math.sin(a) * r + 'px';
    fx.appendChild(e); setTimeout(e.remove.bind(e), 560);
  }
}
function fxConfetti(){
  if (calm) return;
  var fx = $('#fx'), cols = ['#ffd24a','#ff6b2c','#37d0ff','#5fe3a1','#ff5fa8','#fff'];
  for (var i = 0; i < 90; i++) {
    var e = document.createElement('i');
    e.className = 'conf'; e.style.cssText = 'left:' + Math.random() * 100 + '%;background:' + cols[i % 6] + ';--x:' + (Math.random() * 180 - 90) + 'px;--r:' + (360 + Math.random() * 720) + 'deg;--t:' + (2 + Math.random() * 1.6) + 's;--d:' + Math.random() * .5 + 's';
    fx.appendChild(e); setTimeout(e.remove.bind(e), 4300);
  }
}
function fxShake(){
  var w = $('.wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  setTimeout(function(){ w.classList.remove('shake'); }, 520);
}
function fxPop(){ var c = $('#craft'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
document.addEventListener('pointerdown', function(e){
  if (e.target.closest('.opt,.btn:not(:disabled),.hot,.sw,.steps button:not(:disabled),.patch,.lvl')) fxSparks(e.clientX, e.clientY);
});
sheet.addEventListener('change', function(e){ if (/^(design|hull|accent|livery)$/.test(e.target.name)) fxPop(); });
sheet.addEventListener('click', function(e){ if (e.target.closest('[data-act^="perk"]')) fxPop(); });
$('#patch').addEventListener('click', function(){
  var p = this; p.classList.remove('spin'); void p.offsetWidth; p.classList.add('spin');
});
$('.side').addEventListener('pointermove', function(e){
  if (calm) return;
  var b = this.getBoundingClientRect(), c = $('#craft');
  c.style.setProperty('--ry', ((e.clientX - b.left) / b.width - .5) * 26 + 'deg');
  c.style.setProperty('--rx', ((e.clientY - b.top) / b.height - .5) * -18 + 'deg');
});
$('.side').addEventListener('pointerleave', function(){ var c = $('#craft'); c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); });
(function sky(){
  var cv = $('#sky'), g = cv.getContext && cv.getContext('2d'); if (!g) return;
  var W = 0, H = 0, mx = 0, my = 0, px = 0, py = 0, stars = [], shot = null, next = 120;
  function size(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = [];
    for (var i = 0, n = Math.round(W * H / 7000); i < n; i++) stars.push({ x:Math.random() * W, y:Math.random() * H, r:.5 + Math.random() * 1.4, z:.2 + Math.random(), t:Math.random() * 6.283 });
    draw(0);
  }
  function draw(tm){
    g.clearRect(0, 0, W, H);
    stars.forEach(function(s){
      var x = (s.x + px * s.z * 26 + W) % W, y = (s.y + py * s.z * 26 + H) % H;
      g.globalAlpha = calm ? .8 : .45 + .5 * Math.abs(Math.sin(s.t + tm / 900));
      g.fillStyle = s.z > .9 ? '#ffe9b0' : '#dfe9ff';
      g.beginPath(); g.arc(x, y, s.r, 0, 6.283); g.fill();
    });
    g.globalAlpha = 1;
    if (shot) {
      var gr = g.createLinearGradient(shot.x, shot.y, shot.x - 110, shot.y - 44);
      gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(shot.x, shot.y); g.lineTo(shot.x - 110, shot.y - 44); g.stroke();
    }
  }
  function loop(tm){
    if (!document.hidden) {
      px += (mx - px) * .05; py += (my - py) * .05;
      if (shot) { shot.x += 13; shot.y += 5.2; if (shot.x > W + 130) shot = null; }
      else if (--next < 0) { shot = { x:Math.random() * W * .6, y:Math.random() * H * .35 }; next = 240 + Math.random() * 500; }
      draw(tm);
    }
    requestAnimationFrame(loop);
  }
  addEventListener('resize', size);
  addEventListener('pointermove', function(e){ mx = e.clientX / (W || 1) - .5; my = e.clientY / (H || 1) - .5; });
  size();
  if (!calm) requestAnimationFrame(loop);
})();

/* ---------- Boot ---------- */
function start(data){
  if (data && data.state) {
    Object.assign(state, data.state);
    if (state.launching) { state.launching = false; }
  }
  refreshAll();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return { state:state }; });

})();
